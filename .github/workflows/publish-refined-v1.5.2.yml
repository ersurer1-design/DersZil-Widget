name: Replace DersZil v1.5.2 Refined Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-refined-v1.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download final Windows package
        env:
          ASSET_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d724-81f4-9125-47477853e51f/raw?se=2026-10-06T12%3A09%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=848ab76e-4344-5503-bd37-ff94e24a0bd2&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A27%3A23Z&ske=2026-10-07T02%3A27%3A23Z&sks=b&skv=2026-02-06&sig=kRNZhuVz0Ff%2B2R48BJsf6ttML3FDT3n7v4y2rUq9dQU%3D"
        run: |
          curl -fL "$ASSET_URL" -o DersZilWidget-v1.5.2-win-x64.zip
          ls -lh DersZilWidget-v1.5.2-win-x64.zip

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          DersZil Widget v1.5.2

          Bu sürümde Mini Görünüm gerçek bir küçük widget olacak şekilde yeniden tasarlandı ve dağıtım deneyimi iyileştirildi.

          ### Gerçek Mini Görünüm
          - Mini görünüm yaklaşık **300 × 150** boyutundadır.
          - Yalnızca kontrol düğmeleri, **BOŞ DERS / sınıf / mola gibi ana başlık** ve geri sayım bilgisi görünür.
          - Gün/saat, okul adı, ders saat aralığı, alt açıklama, sonraki ders satırı, ilerleme çubuğu ve kazanım alanı Mini Görünümde gizlenir.
          - ↙ ile Mini Görünüm, ↗ ile Tam Görünüm arasında tek tıkla geçiş yapılır.

          ### Arayüz düzeni
          - Tam görünümde okul adı artık butonların altında ayrı bir satırda gösterilir; butonlarla çakışmaz.
          - Sistem tepsisindeki klasik bilgi simgesi yerine DersZil'e özel zil temalı simge kullanılır.

          ### Tek örnek çalışma
          - Yeni DersZil EXE çalıştırıldığında aynı Windows oturumundaki eski DersZil örneği otomatik kapatılır.
          - Güncelleme sonrası iki widget'ın aynı anda açık kalması engellenir.

          ### Sistem
          - Windows 10 x64
          - Windows 11 x64
          - Ek .NET kurulumu gerekmez.

          Hazırlayan: Hasan ERSÜRER
          Bilişim Teknolojileri ve Yazılım Öğretmeni
          EOF

      - name: Update existing v1.5.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.5.2 \
            --repo "${{ github.repository }}" \
            --title "DersZil Widget v1.5.2" \
            --notes-file RELEASE_NOTES.md

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.5.2 DersZilWidget-v1.5.2-win-x64.zip \
            --repo "${{ github.repository }}" \
            --clobber
