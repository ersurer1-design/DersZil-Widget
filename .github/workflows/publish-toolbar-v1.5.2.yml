name: Replace DersZil v1.5.2 External Toolbar Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-toolbar-v1.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download final Windows package
        env:
          ASSET_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8374-8210-ad30-1889debe4c32/raw?se=2026-10-06T12%3A25%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=c2d94371-05f9-525d-a937-e0c850816821&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A52%3A07Z&ske=2026-10-07T01%3A52%3A07Z&sks=b&skv=2026-02-06&sig=Too9F5JXamCtOr8fLLfHIdnNx%2BPAM2stNxEZVJu0Pe0%3D"
        run: |
          curl -fL "$ASSET_URL" -o DersZilWidget-v1.5.2-win-x64.zip
          ls -lh DersZilWidget-v1.5.2-win-x64.zip

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          DersZil Widget v1.5.2

          Bu sürümde Mini Görünüm, dış kontrol şeridi ve güncelleme davranışı birlikte iyileştirildi.

          ### Piyano Tipi Dış Kontrol Şeridi
          - Menü düğmeleri widget gövdesinin içinden çıkarıldı.
          - Düğmeler gövdenin dış kenarına yapışık ayrı bir kontrol şeridi olarak çalışır.
          - **Ayarlar → Genel → Menü tuşları** bölümünden **Sağ / Sol / Üst / Alt** konumu seçilebilir.
          - Sağ/Sol konumda düğmeler dikey, Üst/Alt konumda yatay dizilir.
          - Kontrol şeridi içerik alanını kapatmaz.
          - Varsayılan konum **Sağ**dır.

          ### Gerçek Mini Görünüm
          - Mini görünüm yaklaşık **300 × 150** içerik alanına sahiptir.
          - Yalnızca ana durum başlığı ve geri sayım bilgisi kalır; kontrol düğmeleri dış şeritte görünür.
          - Gün/saat, okul adı, ders saat aralığı, alt açıklama, sonraki ders satırı, ilerleme çubuğu ve kazanım alanı gizlenir.
          - ↙ ile Mini Görünüm, ↗ ile Tam Görünüm arasında geçiş yapılır.

          ### Arayüz ve Dağıtım
          - Sistem tepsisinde DersZil'e özel zil temalı simge kullanılır.
          - Yeni DersZil EXE açıldığında aynı Windows oturumundaki eski DersZil örneği otomatik kapatılır.
          - Böylece güncelleme sonrası iki widget'ın aynı anda açık kalması engellenir.

          ### Sistem
          - Windows 10 x64
          - Windows 11 x64
          - Ek .NET kurulumu gerekmez.

          Hazırlayan: Hasan ERSÜRER
          Bilişim Teknolojileri ve Yazılım Öğretmeni
          EOF

      - name: Update existing v1.5.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.5.2 \
            --repo "${{ github.repository }}" \
            --title "DersZil Widget v1.5.2" \
            --notes-file RELEASE_NOTES.md

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.5.2 DersZilWidget-v1.5.2-win-x64.zip \
            --repo "${{ github.repository }}" \
            --clobber
