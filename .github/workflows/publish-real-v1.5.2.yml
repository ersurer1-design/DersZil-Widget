name: Replace DersZil v1.5.2 with Mini Mode Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-real-v1.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download final Windows package
        env:
          ASSET_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5744-8210-b608-9a034125f386/raw?se=2026-10-06T11%3A52%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=2845753c-19cc-5eee-bb88-5d45e9e90967&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A18%3A46Z&ske=2026-10-07T06%3A18%3A46Z&sks=b&skv=2026-02-06&sig=uXRLsG4rQKCQc2qt0aBkonrrrA/z4xvLhcgZEGGvscY%3D"
        run: |
          curl -fL "$ASSET_URL" -o DersZilWidget-v1.5.2-win-x64.zip
          ls -lh DersZilWidget-v1.5.2-win-x64.zip

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          DersZil Widget v1.5.2

          Bu sürümün ana yeniliği **tek tıkla Mini Görünüm** desteğidir.

          ### Yenilikler
          - ↙ düğmesi ile widget tek tıkla yaklaşık 340 × 205 boyutunda Mini Görünüme geçer.
          - ↗ düğmesi ile Tam Görünüme geri dönülür.
          - Mini Görünümde yalnızca günlük kullanımda gerekli özet bilgiler tutulur:
            - saat,
            - mevcut ders / mevcut durum,
            - sınıf veya ders özeti,
            - geri sayım,
            - ilerleme çubuğu.
          - Yıllık plan ve kazanım alanı Mini Görünümde gizlenir.
          - Okul adı, ayrıntılı sonraki ders satırı ve taşıma ipucu Mini Görünümde gizlenir.
          - Mini / Tam görünüm tercihi kaydedilir ve uygulama yeniden açıldığında korunur.
          - Sistem tepsisine **Mini / Tam görünüm** kısayolu eklendi.
          - Tam görünümde mevcut serbest boyutlandırma, yıllık plan, tema ve diğer özellikler korunur.

          ### Sistem
          - Windows 10 x64
          - Windows 11 x64
          - Ek .NET kurulumu gerekmez.

          Hazırlayan: Hasan ERSÜRER
          Bilişim Teknolojileri ve Yazılım Öğretmeni
          EOF

      - name: Update existing v1.5.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.5.2 \
            --repo "${{ github.repository }}" \
            --title "DersZil Widget v1.5.2" \
            --notes-file RELEASE_NOTES.md

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.5.2 DersZilWidget-v1.5.2-win-x64.zip \
            --repo "${{ github.repository }}" \
            --clobber
