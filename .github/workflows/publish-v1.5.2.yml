name: Publish DersZil v1.5.2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        env:
          ASSET_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-b8d8-81f4-87ff-e26a06e9d4ae/raw?se=2026-10-06T11%3A44%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=a95428ea-ef01-5024-8bb7-deb676748743&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A37%3A37Z&ske=2026-10-07T06%3A37%3A37Z&sks=b&skv=2026-02-06&sig=ogWcFeJFDo0/xAUflsLyOWGQIsxxEFiaYzyjW%2BKSjhU%3D"
        run: |
          curl -fL "$ASSET_URL" -o DersZilWidget-v1.5.2-win-x64.zip
          ls -lh DersZilWidget-v1.5.2-win-x64.zip

      - name: Prepare release notes
        run: |
          printf '%s\n' \
            'Güncelleme sistemi test sürümü.' \
            '' \
            '- v1.5.1 kullanan istemcilerin yeni sürümü algılamasını test etmek için yayımlandı.' \
            '- GitHub Releases üzerinden sürüm denetimi ve indirme sayfasına yönlendirme akışı doğrulanacak.' \
            '- İşlevsel olarak v1.5.1 tabanını korur.' \
            '- Windows 10/11 x64.' \
            '' \
            'Test: v1.5.1 içinde Hazırlayan → Güncellemeleri Denetle seçeneğini kullanın.' \
            '' \
            'Hazırlayan: Hasan ERSÜRER' \
            'Bilişim Teknolojileri ve Yazılım Öğretmeni' > RELEASE_NOTES.md

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.5.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v1.5.2 \
              --repo "${{ github.repository }}" \
              --title "DersZil Widget v1.5.2" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.5.2 DersZilWidget-v1.5.2-win-x64.zip \
            --repo "${{ github.repository }}" \
            --clobber
