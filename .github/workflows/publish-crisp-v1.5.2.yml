name: Replace DersZil v1.5.2 Crisp Controls Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-crisp-v1.5.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download final Windows package
        env:
          ASSET_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-80ac-8210-af2b-a7cdb91f8270/raw?se=2026-10-06T13%3A06%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=189c4b5b-12c7-5e62-be7b-395b3793fda0&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T03%3A14%3A15Z&ske=2026-10-07T03%3A14%3A15Z&sks=b&skv=2026-02-06&sig=7zQSIejKMxhyzjpPWEPp7JhvR7U%2B15izSjiJfAHC1EE%3D"
        run: |
          curl -fL "$ASSET_URL" -o DersZilWidget-v1.5.2-win-x64.zip
          ls -lh DersZilWidget-v1.5.2-win-x64.zip

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          DersZil Widget v1.5.2

          Bu paket v1.5.2'nin sadeleştirilmiş ve netleştirilmiş üst kontrol düğmeli son derlemesidir.

          ### Kontrol düğmeleri
          - Geniş menü arka planı kaldırıldı.
          - Düğmeler şeffaf zeminde yuvarlak çerçeveli olarak görünür.
          - Fare üzerine gelince yalnızca ilgili düğmenin çerçevesi tema rengine dönüşür.
          - Büyüyen / metin açan düğme animasyonları kaldırıldı.
          - Simgeler daha net görünüm için vektör Windows simgelerine geçirildi.

          ### Mini görünüm
          - Mini görünüm **310 × 175** ölçüsüne çıkarıldı.
          - "Sonraki ders / Perşembe" gibi uzun değerlerin alt kısımda sıkışması düzeltildi.
          - Gün adı için doğal genişlik ayrılır; etiket gerektiğinde kontrollü biçimde kısalır.
          - Gün/saat, okul adı, ders saat aralığı, açıklama, ayrıntılı sonraki ders satırı, ilerleme çubuğu ve kazanım alanı mini görünümde gizli kalır.

          ### Diğer
          - Koyu, Açık ve Gökkuşağı temaları yeni hover çerçevesine uyarlanmıştır.
          - Yeni EXE açıldığında aynı Windows oturumundaki eski DersZil örneği otomatik kapatılır.

          Hazırlayan: Hasan ERSÜRER
          Bilişim Teknolojileri ve Yazılım Öğretmeni
          EOF

      - name: Update existing v1.5.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.5.2 \
            --repo "${{ github.repository }}" \
            --title "DersZil Widget v1.5.2" \
            --notes-file RELEASE_NOTES.md

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.5.2 DersZilWidget-v1.5.2-win-x64.zip \
            --repo "${{ github.repository }}" \
            --clobber
